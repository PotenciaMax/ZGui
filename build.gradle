plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'me.zmaster'
version = '3.1.1'

repositories {
    mavenCentral()
    maven { url = uri("https://hub.spigotmc.org/nexus/content/groups/public/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-snapshots/") }
}

dependencies {
    api 'com.github.cryptomorin:XSeries:13.6.0'
    api 'net.objecthunter:exp4j:0.4.8'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly("org.spigotmc:spigot-api:1.20.2-R0.1-SNAPSHOT")
    compileOnly("com.github.retrooper:packetevents-spigot:2.11.2")
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifact sourcesJar
        }
    }
}

shadowJar {
    relocate 'com.cryptomorin.xseries', 'me.zmaster.libs.xseries'
    relocate 'net.objecthunter.exp4j', 'me.zmaster.libs.exp4j'

    archiveFileName = "ZGui.jar"
}

tasks.build {
    dependsOn tasks.publish
    dependsOn tasks.shadowJar
}
